server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /var/www/zhibo/admin-web;
    index index.html;

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Page on 5173; admin API on local port 80. Prefix matches VITE_APP_BASE_API=/live-admin.
    location /live-admin/ {
        proxy_pass http://127.0.0.1:80/live-admin/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
