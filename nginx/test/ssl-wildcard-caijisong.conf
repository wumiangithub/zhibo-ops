# Wildcard cert for *.caijisong.com.cn — include inside server { } blocks.
ssl_certificate     /etc/nginx/ssl/STAR.caijisong.com.cn.crt;
ssl_certificate_key /etc/nginx/ssl/STAR.caijisong.com.cn.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;
