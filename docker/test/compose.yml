name: zhibo
services:
  zhibo-mysql:
    image: mysql:8.4
    container_name: zhibo-mysql
    restart: unless-stopped
    env_file:
      - /home/ubuntu/.secrets/zhibo-mysql-container.env
    environment:
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=512M
      - --max-connections=50
      - --bind-address=0.0.0.0
    volumes:
      - /home/ubuntu/zhibo/mysql/data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - zhibo
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  zhibo-admin:
    image: eclipse-temurin:17-jre
    container_name: zhibo-admin
    working_dir: /app
    depends_on:
      zhibo-mysql:
        condition: service_healthy
    volumes:
      - /home/ubuntu/zhibo/jars/admin-service-1.0.0.jar:/app/app.jar:ro
      - /home/ubuntu/zhibo/docker/entrypoint.sh:/app/entrypoint.sh:ro
      - /home/ubuntu/.secrets/zhibo-container-mysql.password:/run/secrets/zhibo-mysql.password:ro
    env_file:
      - /home/ubuntu/.secrets/zhibo-java.env
    environment:
      TZ: Asia/Shanghai
      SERVER_ADDRESS: "0.0.0.0"
      ADMIN_SERVER_PORT: "9080"
      MYSQL_HOST: zhibo-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: zhibo
      MYSQL_USER: zhibo
    ports:
      - "127.0.0.1:9080:9080"
    networks:
      - zhibo
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: ["java", "-Xms256m", "-Xmx768m", "-Duser.timezone=Asia/Shanghai", "-jar", "app.jar"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  zhibo-live:
    image: eclipse-temurin:17-jre
    container_name: zhibo-live
    working_dir: /app
    depends_on:
      zhibo-mysql:
        condition: service_healthy
    volumes:
      - /home/ubuntu/zhibo/jars/live-service-1.0.0.jar:/app/app.jar:ro
      - /home/ubuntu/zhibo/docker/entrypoint.sh:/app/entrypoint.sh:ro
      - /home/ubuntu/.secrets/zhibo-container-mysql.password:/run/secrets/zhibo-mysql.password:ro
    env_file:
      - /home/ubuntu/.secrets/zhibo-java.env
    environment:
      TZ: Asia/Shanghai
      SERVER_ADDRESS: "0.0.0.0"
      LIVE_SERVER_PORT: "9081"
      MYSQL_HOST: zhibo-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: zhibo
      MYSQL_USER: zhibo
    ports:
      - "127.0.0.1:9081:9081"
    networks:
      - zhibo
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: ["java", "-Xms256m", "-Xmx768m", "-Duser.timezone=Asia/Shanghai", "-jar", "app.jar"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  zhibo:
    name: zhibo-net
